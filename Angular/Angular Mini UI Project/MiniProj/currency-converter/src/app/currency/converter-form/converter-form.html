<div class="converter-container">
  <h2 class="converter-title">Currency Converter</h2>
  <form (ngSubmit)="onSubmit()" class="row g-3">
    <div class="col-md-4">
      <label for="amount" class="form-label">Amount</label>
      <input 
        id="amount" 
        type="number" 
        [(ngModel)]="amount" 
        name="amount" 
        class="form-control" 
        placeholder="Enter amount" 
        required>
    </div>

    <div class="col-md-4">
      <label for="from" class="form-label">From Currency</label>
      <select 
        id="from" 
        [(ngModel)]="from" 
        name="from" 
        class="form-select" 
        title="Select source currency">
        <option *ngFor="let c of currencies">{{c}}</option>
      </select>
    </div>

    <div class="col-md-4">
      <label for="to" class="form-label">To Currency</label>
      <select 
        id="to" 
        [(ngModel)]="to" 
        name="to" 
        class="form-select" 
        title="Select target currency">
        <option *ngFor="let c of currencies">{{c}}</option>
      </select>
    </div>

    <div class="col-12 text-center mt-4">
      <button class="btn btn-primary convert-button" type="submit">Convert</button>
    </div>
  </form>
</div>
