<h3>Conversion History</h3>
    <div *ngFor="let item of historyItems">
      {{ item.date | date:'short' }}: 
      {{ item.amount | formatCurrency:item.from }} = 
      {{ item.result | formatCurrency:item.to }}
    </div>
